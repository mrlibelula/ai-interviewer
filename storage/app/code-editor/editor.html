    <script src="https://cdnjs.cloudflare.com/ajax/libs/alpinejs/2.3.0/alpine.js" integrity="sha512-nIwdJlD5/vHj23CbO2iHCXtsqzdTTx3e3uAmpTm4x2Y8xCIFyWu4cSIV8GaGe2UNVq86/1h9EgUZy7tn243qdA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <style>
        /* Fill the parent iframe only — never use vh heights (IDE uses height:auto
           flex sizing; 250vh content made the iframe explode over the toolbar). */
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        
        .wrapper {
            display: flex;
            width: 100%;
            height: 100%;
            min-height: 0;
            flex-direction: column;
            align-items: stretch;
            justify-content: start;
            overflow: hidden;
        }
        
        .editor {
            width: 100%;
            flex: 1 1 0;
            min-height: 0;
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .editor__code {
            position: relative;
            border: none;
            flex: 1 1 0;
            min-height: 0;
        }
        
        /* Parent page owns Run/Output — keep embed chrome out of the height chain */
        .editor__preview,
        .buttons,
        #output-frame {
            display: none !important;
        }
        
        .editor__code > * {
            position: absolute;
            width: 100%;
            height: 100%;
        }
        
        .button {
            background: #f5df1b;
            color: #000000;
            width: 10em;
            padding: 0.6em 2.3em 0.7em;
            border-radius: 4px;
            font-weight: 400;
            border: none;
            cursor: pointer;
            font-family: sans-serif;
            font-size: 15px;
            box-shadow: inset 0 -1px 1px rgba(0, 0, 0, 0.1);
            transition: background-color .1s ease;
        }
        
        .button:hover {
            background: #ffed4e;
        }
        
        .button:active {
            background: #e6d329;
            padding: 0.7em 2.3em 0.6em;
            box-shadow: inset 0 1px 1px rgba(0, 0, 0, 0.3);
        }
        
        .button:disabled {
            pointer-events: none;
        }
    </style>
</head>

        function parseParentDarkMode() {
            try {
                const iframeEl = parent.document.querySelector('#codeIframe')
                const attr = iframeEl ? iframeEl.getAttribute('dark-mode') : null
                // Alpine removes the attr when false; may set "" / "true" when true
                if (attr !== null) {
                    const v = String(attr).toLowerCase()
                    if (v === 'false' || v === '0') return false
                    if (v === 'true' || v === '1' || v === '') return true
                }
                if (parent.document.documentElement.classList.contains('dark')) return true
                return parent.localStorage.getItem('dark') === 'true'
            } catch (e) {
                return false
            }
        }

        function applyMonacoTheme(dark) {
            isDarkMode = !!dark
            theme = isDarkMode ? 'vs-dark' : 'vs'
            if (typeof monaco === 'undefined' || !monaco.editor || !monacoEditorReady) {
                pendingThemeDark = isDarkMode
                return
            }
            try {
                monaco.editor.setTheme(isDarkMode ? 'default' : 'vs')
            } catch (e) {}
        }

        function handleParentThemeMessage(event) {
            if (!event.data || typeof event.data !== 'object') return
            if (event.data.type === 'data' && typeof event.data.data === 'boolean') {
                applyMonacoTheme(event.data.data)
                return
            }
            if (event.data.type === 'theme' && typeof event.data.darkMode === 'boolean') {
                applyMonacoTheme(event.data.darkMode)
            }
        }

        // Theme toggle from parent (theme-switcher posts { type: 'data', data: bool })
        window.addEventListener('message', handleParentThemeMessage)

        // Also react when Alpine updates :dark-mode on the iframe (covers all toggles)
        try {
            const iframeEl = parent.document.querySelector('#codeIframe')
            if (iframeEl && typeof MutationObserver !== 'undefined') {
                new MutationObserver(() => {
                    applyMonacoTheme(parseParentDarkMode())
                }).observe(iframeEl, { attributes: true, attributeFilter: ['dark-mode'] })
            }

        function decodeString(encodedString) {
            return new Promise((resolve, reject) => {
                // Make a GET request to the backend API endpoint
                fetch(`api/decode/${encodedString}`)
                    .then(response => {
                        if (!response.ok) throw new Error('Failed to decode string')
                        return response.text()
                    })
                    .then(decodedData => {
                        resolve(decodedData)
                    })
                    .catch(error => {
                        reject(error)
                    })
            })
        }

        /**
         * Convert leading tabs / mixed spaces to N-space indent levels (JS: 2).
         * Depth is inferred from tabs (1 level) and runs of spaces (grouped by size).
         */
        function normalizeLeadingIndent(code, spacesPerLevel = 2) {
            if (!code) return code
            const size = Math.max(1, spacesPerLevel | 0)
            return String(code).split('\n').map(line => {
                const m = line.match(/^([ \t]*)(.*)$/)
                if (!m || !m[1]) return line
                let depth = 0
                let i = 0
                const ws = m[1]
                while (i < ws.length) {
                    if (ws[i] === '\t') {
                        depth++
                        i++
                        continue
                    }
                    let spaces = 0
                    while (i < ws.length && ws[i] === ' ') {
                        spaces++
                        i++
                    }
                    depth += Math.floor(spaces / size)
                    if (spaces % size !== 0) depth++
                }
                return ' '.repeat(depth * size) + m[2]
            }).join('\n')
        }

            editorCopyButton.onclick = () => {
                //sendUserCode(editor.getValue())
                //runJsCode(editor)
            }

            window.addEventListener('message', event => {
                // Theme messages are handled by handleParentThemeMessage
                if (event.data && (event.data.type === 'data' || event.data.type === 'theme')) {
                    return
                }
                const getCode = event.data.getCode ?? false  // bool
                const runCode = event.data.runCode ?? false  // bool
                const saveCode = event.data.saveCode ?? false  // bool
                const complexity = event.data.complexity ?? false  // bool
                const analyze = event.data.analyze ?? false  // bool
                if (complexity) {
                    sendUserCodeForComplexity(editor.getValue())
                }
                // send current editor code
                if (getCode && !saveCode) {
                    sendUserCode(editor.getValue())
                } 
                if (getCode && saveCode) {
                    sendUserCode(editor.getValue(), true)
                } 
                if (runCode) {
                    //runJsCode(editor)
                    sendUserCodeForExecution(editor.getValue(), true, analyze)
                }
            })

            return editor
        }

        function sendUserCodeForExecution(code, runCode = true, analyze = false) {
            window.parent.postMessage({ code: code, runCode: runCode, analyze: analyze }, '*')
        }

        function sendUserCode(code, saveCode = false) {
            !saveCode
                ? window.parent.postMessage({ code: code }, '*')
                : window.parent.postMessage({ code: code, saveCode: saveCode }, '*')
        }
        function sendUserCodeForComplexity(code, complexity = true) {
            window.parent.postMessage({ code: code, complexity: complexity }, '*')
        }

        function monacoEnviro() {
            window.MonacoEnvironment = {
                getWorkerUrl: function (workerId, label) {
                    return `data:text/javascript;charset=utf-8,${encodeURIComponent(`
                        self.MonacoEnvironment = {
                            baseUrl: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/'
                        };
                        importScripts('https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/base/worker/workerMain.js');`, { type: 'text/javascript' })}`;} };

            // Monaco init
            require(["vs/editor/editor.main"], function () {
                try {
                    const editor = createEditor(editorCode)
                    // Re-layout when parent accordion/iframe becomes visible (Monaco blank if created at 0 size)
                    if (editor && typeof ResizeObserver !== 'undefined') {
                        const ro = new ResizeObserver(() => {
                            try { editor.layout() } catch (e) {}
                        })
                        ro.observe(editorCode)
                    }
                    setTimeout(() => {
                        try { editor && editor.layout() } catch (e) {}
                    }, 100)
                } catch (err) {
                    console.error('Monaco create failed', err)
                    const errEl = document.getElementById('editorLoadError')
                    if (errEl) errEl.style.display = 'block'
                }
            }, function (err) {
                console.error('Monaco AMD load failed', err)
                const errEl = document.getElementById('editorLoadError')
                if (errEl) errEl.style.display = 'block'
            })
        }
