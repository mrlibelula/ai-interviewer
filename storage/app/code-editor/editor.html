    <style>
        html,
        body {
            margin: 0;
            padding: 0;
        }
        
        .wrapper {
            display: flex;
            /*min-height: 95vh;*/
            min-height: 100vh;
            flex-direction: column;
            align-items: center;
            justify-content: start;
        }
        
        .editor {
            width: 100%;
            /*max-width: 900px;*/
            /*margin: 50px auto 40px;*/
            /*height: 1500px;*/
            height: 250vh;
            display: flex;
            flex-direction: column;
            /*box-shadow: 0 7px 7px rgba(0, 0, 0, .1), 0 -2px 3px rgba(0, 0, 0, .125);*/
        }
        
        .editor__code {
            position: relative;
            border: none;
            /*flex-basis: 70%;*/
            flex-basis: 100%;
        }
        
        .editor__preview {
            position: relative;
            /*flex-basis: 30%;*/
            flex-basis: 100%;
        }
        
        .editor__code > *,
        .editor__preview > * {
            position: absolute;
            width: 100%;
            height: 100%;
        }
        
        .buttons {
            text-align: right;
        }
        
        .button {
            background: #f5df1b;
            color: #000000;
            width: 10em;
            padding: 0.6em 2.3em 0.7em;
            border-radius: 4px;
            font-weight: 400;
            border: none;
            cursor: pointer;
            font-family: sans-serif;
            font-size: 15px;
            box-shadow: inset 0 -1px 1px rgba(0, 0, 0, 0.1);
            transition: background-color .1s ease;
        }
        
        .button:hover {
            background: #ffed4e;
        }
        
        .button:active {
            background: #e6d329;
            padding: 0.7em 2.3em 0.6em;
            box-shadow: inset 0 1px 1px rgba(0, 0, 0, 0.3);
        }
        
        .button:disabled {
            pointer-events: none;
        }
    </style>

        function decodeString(encodedString) {
            return new Promise((resolve, reject) => {
                // Make a GET request to the backend API endpoint
                fetch(`api/decode/${encodedString}`)
                    .then(response => {
                        if (!response.ok) throw new Error('Failed to decode string')
                        return response.text()
                    })
                    .then(decodedData => {
                        resolve(decodedData)
                    })
                    .catch(error => {
                        reject(error)
                    })
            })
        }

            let editor = monaco.editor.create(editorContainer, {

            editorCopyButton.onclick = () => {
                //sendUserCode(editor.getValue())
                //runJsCode(editor)
            }

            window.addEventListener('message', event => {
                const getCode = event.data.getCode ?? false  // bool
                const runCode = event.data.runCode ?? false  // bool
                const saveCode = event.data.saveCode ?? false  // bool
                const complexity = event.data.complexity ?? false  // bool
                if (complexity) {
                    sendUserCodeForComplexity(editor.getValue())
                }
                // send current editor code
                if (getCode && !saveCode) {
                    sendUserCode(editor.getValue())
                } 
                if (getCode && saveCode) {
                    sendUserCode(editor.getValue(), true)
                } 
                if (runCode) {
                    //runJsCode(editor)
                    sendUserCodeForExecution(editor.getValue(), true)
                }
            })
            
        }

        function sendUserCodeForExecution(code, runCode = true) {
            window.parent.postMessage({ code: code, runCode: runCode }, '*')
        }

        function sendUserCode(code, saveCode = false) {
            !saveCode
                ? window.parent.postMessage({ code: code }, '*')
                : window.parent.postMessage({ code: code, saveCode: saveCode }, '*')
        }
        function sendUserCodeForComplexity(code, complexity = true) {
            window.parent.postMessage({ code: code, complexity: complexity }, '*')
        }

                        };
                        importScripts('https://cdn.jsdelivr.net/npm/monaco-editor/min/vs/base/worker/workerMain.js');`, { type: 'text/javascript' })}`;} };
            
            // Monaco init
            require(["vs/editor/editor.main"], function () {
                createEditor(editorCode)
            })
        }
